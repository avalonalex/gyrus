[package]
name = "gyrus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Command-line BrainFuck interpreter"
license.workspace = true
repository.workspace = true

[[bin]]
name = "gyrus"
path = "src/main.rs"

[features]
# `--jit`: compile with Cranelift instead of interpreting. On by default;
# `--no-default-features` builds the interpreter-only binary.
default = ["jit"]
jit = ["dep:gyrus-jit"]

[dependencies]
gyrus.workspace = true
# `.bfm` input: expanded here so that a macro program runs like any other.
gyrus-macro.workspace = true
gyrus-jit = { workspace = true, optional = true }
clap.workspace = true

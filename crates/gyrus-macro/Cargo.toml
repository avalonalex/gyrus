[package]
name = "gyrus-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Macro preprocessor for BrainFuck: expands .bfm source to pure BrainFuck, carrying an origin map so runtime errors name the macro source"
license.workspace = true
repository.workspace = true

# Deliberately three. The PRD proposed regex, lazy_static, serde and serde_json
# as well; none earns its place yet. The scanner is a char loop, as `gyrus`'s
# parser and `gyrus-corpus`'s TOML reader are, and the JSON source-map export
# has no reader -- when one appears, `serde_json` is already a workspace
# dependency.
#
# `termcolor` is here so that a macro error is rendered by the same highlighter
# as a BrainFuck error rather than by a hand-rolled imitation of it. It is
# already in the graph via `gyrus`.
[dependencies]
gyrus.workspace = true
thiserror.workspace = true
termcolor.workspace = true

[dev-dependencies]
# The same workspace-root helper both corpus suites use, so these tests find
# programs/ the way every other test in the repository does.
gyrus-corpus.workspace = true
# A seedable RNG for the oracle generator, which builds macro programs whose
# answer is known by construction. Test-only: the generator is not API, so it
# lives in the test rather than behind a feature the way `gyrus::random` does.
rand.workspace = true

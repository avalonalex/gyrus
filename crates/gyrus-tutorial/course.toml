# The course.
#
# One [[lesson]] per lesson, in order. Read by `src/lesson.rs`, which parses
# exactly this shape and refuses anything else -- a misspelled key is an error
# rather than a claim quietly dropped.
#
# Keys:
#   title, body, task           what the learner reads
#   starter, answer, hints      what the editor opens with, and the way out
#   cells, input                the tape the lesson runs on
#   solved_cells/_output/_length   what the learner has to achieve; omit all
#                               three for a lesson that only wants reading
#   shows_ending                "finished" or "capped" -- what the starter does
#   shows_cells/_output/_prefix    what the starter provably leaves behind,
#                               tested so the prose cannot drift from the code
#
# Bodies are '''literal''' blocks: no escapes, and the first newline after the
# opening delimiter is dropped.

[[lesson]]
title = "Welcome"
cells = 16
starter = ""
answer = "+"
solved_cells = [[0, 1]]
shows_ending = "finished"
hints = ["One character. The tape starts at zero, and + adds one."]
task = '''
Type a single + and run it with ctrl-r. Watch cell 0.'''
body = '''
BrainFuck gives you a tape of numbered cells, every one of them zero, and a pointer sitting on cell 0.

There are eight commands, and they are the entire language:

  +   add one to the cell under the pointer
  -   subtract one
  >   move the pointer one cell right
  <   move it one cell left
  .   print the cell as a character
  ,   read a character into the cell
  [   if the cell is zero, jump past the matching ]
  ]   jump back to the matching [

Every other character is a comment. That is why BrainFuck programs can be hidden inside English, and why a typo is silently ignored rather than reported.

Those eight commands are enough to compute anything any computer can compute. The rest of this course is about why that is true and what it costs.'''

[[lesson]]
title = "Counting"
cells = 16
starter = "++++-"
answer = "+++++++"
solved_cells = [[0, 7]]
shows_ending = "finished"
shows_cells = [[0, 3]]
hints = ["Seven pluses is the direct route.", "So is nine pluses and two minuses. Both are right; one is shorter."]
task = '''
Leave 7 in cell 0.'''
body = '''
+ and - are the whole of arithmetic. There is no way to write the number seven. You write seven pluses.

Run the program below, then press tab and walk through it with the arrow keys. Watch the value climb and then drop back.

A cell holds one byte: 0 to 255. Add one to 255 and you are at 0 again. Subtract one from 0 and you are at 255. Nothing complains — the wheel simply turns. gyrus can be told to complain instead, with --cell-model checked, which is how you find the bug where you meant to subtract four and subtracted five.'''

[[lesson]]
title = "The pointer"
cells = 16
starter = "+>++>+++"
answer = "+++>++>+"
solved_cells = [[0, 3], [1, 2], [2, 1]]
shows_ending = "finished"
shows_cells = [[0, 1], [1, 2], [2, 3]]
hints = ["Only the number of pluses in each group has to change."]
task = '''
Now reverse it: 3 in cell 0, 2 in cell 1, 1 in cell 2.'''
body = '''
> and < move the pointer. They change nothing on the tape; they change which cell + - . and , are talking about.

Run +>++>+++ and step through it. The ▲ under the tape moves, and each cell keeps whatever it was given after the pointer leaves.

The pointer is the only way this language has of pointing at anything. There are no names. "Cell 3 is the loop counter" is a fact you keep in your head, and losing track of where the pointer is left off is the most common way a BrainFuck program goes wrong. You will do it in lesson 9.'''

[[lesson]]
title = "Loops"
cells = 16
starter = "++[>+<-]"
answer = "+++++[>>+<<-]"
solved_cells = [[0, 0], [2, 5]]
shows_ending = "finished"
shows_cells = [[1, 2]]
hints = ["Start with five pluses instead of two.", "Two > to reach cell 2 means two < to get back to the counter.", "Forget the second < and the ] will be testing the wrong cell."]
task = '''
Move a 5 from cell 0 into cell 2 rather than cell 1.'''
body = '''
[ and ] are the only branch and the only jump in the language.

  [   if the cell under the pointer is zero, skip past the ]
  ]   go back to the [

So a loop runs while the current cell is not zero, which means the body has to change that cell or the loop never ends.

Run ++[>+<-] and step through it slowly, watching two cells:

  cell 0 counts down    2, 1, 0
  cell 1 counts up      0, 1, 2

When cell 0 reaches zero the [ stops jumping back.

So what did it do? It moved the value. Not copied — moved. Cell 0 is empty at the end, and that is the price of the simplest loop in the language. Getting a copy instead takes lesson 10.'''

[[lesson]]
title = "Clearing"
cells = 16
starter = "+++++"
answer = "+++++[-]>+++++++++"
solved_cells = [[0, 0], [1, 9]]
shows_ending = "finished"
shows_cells = [[0, 5]]
hints = ["Two steps: build the 5, then clear it with [-].", "Then move right and count to nine."]
task = '''
Set cell 0 to 5 and then clear it, and leave 9 in cell 1.'''
body = '''
How do you set a cell to zero when you do not know what is in it?

  [-]

Read it as a sentence: while this cell is not zero, subtract one. It lands on zero and stops, whatever it started at.

You will see [-] constantly. gyrus's optimizer recognises it by shape and replaces the entire loop with a single store — run gyrus-tool optimize on a program and look for Zero in the output.

Its evil twin is [+]. That terminates too, by climbing to 255 and wrapping round to 0, which takes 256 iterations to do what [-] does in as many as the cell needs. gyrus-tool validate warns about it, and under --cell-model checked it is not a slow program but a failing one.'''

[[lesson]]
title = "Multiplication"
cells = 16
starter = "+++[>++++<-]"
answer = "++++++[>+++++++<-]"
solved_cells = [[1, 42]]
shows_ending = "finished"
shows_cells = [[1, 12]]
hints = ["Six in the counter, seven added each pass.", "Or seven in the counter and six added — multiplication does not mind."]
task = '''
Compute 6 x 7 and leave 42 in cell 1.'''
body = '''
A loop that adds to a second cell on every pass multiplies.

  +++[>++++<-]

Cell 0 counts three times; each pass adds four to cell 1. Three fours is twelve.

What is in cell 0 afterwards? Zero. The counter is consumed. Multiplication always costs you the multiplier here, and keeping it means copying it first — which is lesson 10, and which is why BrainFuck programs are mostly bookkeeping.

gyrus recognises this shape too. The optimizer calls it MultiplyAdd and computes the result without looping at all, which is why a program that spends its life in loops like this one runs far faster than its step count suggests it should.'''

[[lesson]]
title = "Why this is enough"
cells = 16
starter = "+++[>++++<-]>."
answer = "+++[>++++<-]>."
shows_ending = "finished"
shows_cells = [[1, 12]]
hints = ["There is nothing to get right here. ctrl-n moves on."]
task = '''
Nothing to solve. Run whatever you like, then press ctrl-n.'''
body = '''
Look at what six lessons of eight characters have built:

  a value            a cell
  a variable         a cell you decided to call something
  assignment         [-] and then that many +
  addition           [>+<-]
  multiplication     a loop that adds
  unbounded memory   the tape keeps going

A language is Turing complete when it has unbounded storage, a way to branch on a value, and a way to repeat. You have all three, and you have not used anything that was not in lesson 3.

The conclusion is not that BrainFuck is powerful. It is that power is cheap. Anything computable is computable here — slowly, and unreadably, but computable. Your compiler's back end and your CPU's instruction set are doing the same work against the same ceiling, with better ergonomics.

Everything after this lesson is ergonomics.'''

[[lesson]]
title = "Input and output"
cells = 16
starter = "++++++++[>++++++++<-]>+."
answer = "++++++++[>+++++++++<-]>.+++++++++++++++++++++++++++++++++."
solved_output = "Hi"
shows_ending = "finished"
shows_cells = [[1, 65]]
shows_output = "A"
hints = ["Eight nines is 72, and 72 is H.", "i is 105, which is 33 more than H. You are already on the right cell."]
task = '''
Print Hi. H is 72 and i is 105.'''
body = '''
. prints the cell under the pointer as a character. , reads one into it.

Characters are numbers: A is 65, a is 97, a space is 32, a newline is 10. So printing A means getting 65 into a cell and then saying . — and the short way to 65 is not sixty-five pluses:

  ++++++++[>++++++++<-]>+.

Eight eights is 64, and then one more. Run it.

, reads a byte from the program's input. What happens when there is none left is a choice rather than a law, and implementations disagree: gyrus can give you 0, give you 255, leave the cell untouched, or stop with an error, under --eof-behavior. Here it gives you 0. A program that reads input and does not agree with its interpreter about this will read one byte too many and loop.'''

[[lesson]]
title = "Nested loops"
cells = 16
starter = "++++++++++[>++++++++++<-]"
answer = "++++++++++[>>++++++++++<<-]"
solved_cells = [[2, 100]]
solved_length = 40
shows_ending = "finished"
shows_cells = [[1, 100]]
hints = ["The starter puts 100 in cell 1. You want it one cell further right.", "Two > inside the loop means two < before the -."]
task = '''
Leave 100 in cell 2, in under 40 characters.'''
body = '''
A loop body can contain another loop, which is how you get large numbers without typing them.

  ++++++++++[>++++++++++<-]

Ten tens: cell 1 ends at 100, and you typed twenty-five characters instead of a hundred.

The outer counter is consumed on the way, as always, so a two-level nest needs one cell per level plus one for the answer. Keeping track of which cell is counting what is the entire difficulty, and it does not get easier — it is why lesson 10 exists and why real BrainFuck programs are written with a diagram of the tape beside them.'''

[[lesson]]
title = "Making a decision"
cells = 16
starter = "+++++++++++[>+++++++++++<-]+++[>.<]"
answer = "+++++++++++[>+++++++++++<-]+++[[-]>.<]"
solved_cells = [[0, 0]]
solved_output = "y"
shows_ending = "capped"
shows_cells = [[0, 3], [1, 121]]
shows_output_prefix = "yyyy"
hints = ["Lesson 3: a loop runs while its cell is not zero. Which cell does this one test?", "Nothing inside the body changes cell 0, so the test never changes its answer.", "[ [-] ... ] clears the flag on the way in, so the body runs once."]
task = '''
Make it print y exactly once and stop.'''
body = '''
There is no if. There is [ , which is an if that repeats — so an if is a loop you make sure cannot go round a second time:

  [ clear the cell, then do the thing ]

The program below builds the letter y in cell 1, puts a 3 in cell 0 as a flag, and is meant to print y once because that flag is not zero.

Run it. It prints y several thousand times and the tutorial cuts it off.

Nothing in the loop body ever touches cell 0, so lesson 3's rule bites: a loop runs while its cell is not zero, and this one has no way to become zero. Clearing the flag is the whole of what turns a loop into an if.

The other way to get this wrong is subtler, and you will meet it soon enough. The ] tests whatever cell the pointer is on when it is reached, not the cell the [ tested. Drop the < and the loop starts asking a different cell every time round, and the pointer walks off down the tape.

For a real else you need a second cell: set an else-flag to 1, clear it inside the then-branch, and follow with a loop on the else-flag.'''

[[lesson]]
title = "Copying"
cells = 16
starter = "+++++[>+>+<<-]"
answer = "+++++[>+>+>+<<<-]>>>[<<<+>>>-]"
solved_cells = [[0, 5], [1, 5], [2, 5]]
shows_ending = "finished"
shows_cells = [[1, 5], [2, 5]]
hints = ["One pass can fill three cells, not two.", "Then move one of them back into cell 0 with a second loop.", "Every > inside a loop body needs its < before the ]."]
task = '''
Leave 5 in each of cells 0, 1 and 2. Use cell 3 as scratch.'''
body = '''
Moving a value takes one loop. Copying one takes a spare cell and a second pass:

  [>+>+<<-]      empty cell 0 into cells 1 and 2
  >>[<<+>>-]     empty cell 2 back into cell 0

Cell 2 was scratch. Cell 0 ends with what it started with, cell 1 has the copy, and the scratch cell is zero again — which matters, because the next thing you write will assume it is.

This is what passes for a subroutine here: a shape you write out again every time you need it, with the cell numbers adjusted by hand. There is no call, no return, and no arguments. Only a pattern, and the discipline to keep your tape straight.

That is also the argument for the macro preprocessor gyrus has a design for and no code behind. Until it exists, you type the pattern out.'''

[[lesson]]
title = "Walking the tape"
cells = 16
starter = "++++++++++++++++[>++++>++++>++++<<<-]"
answer = "++++++++++++++++[>++++>++++>++++<<<-]>+.>++.>+++."
solved_output = "ABC"
shows_ending = "finished"
shows_cells = [[1, 64], [2, 64], [3, 64]]
hints = ["The starter leaves 64 in each of cells 1, 2 and 3.", "64 is one less than A, two less than B, three less than C.", "Move right, add the difference, print. Three times."]
task = '''
Print ABC — 65, 66, 67 — by building the codes with a loop.'''
body = '''
A list is a run of consecutive cells, and the pointer is the index. To walk one until it runs out, use a zero cell as the end marker:

  [>]     move right until you land on a zero
  [<]     move left until you land on a zero

Read [>] with lesson 3 in mind and it is obvious: while this cell is not zero, move right. It is a loop whose body never touches a value.

gyrus recognises both. The optimizer calls them SeekRight and SeekLeft and does the whole walk as one operation rather than one step per cell, which is the difference between scanning a long tape and scanning it slowly.

Building a string is the same idea run backwards: fill a run of cells with character codes, then walk it printing as you go.'''

[[lesson]]
title = "Adding, and keeping the number"
cells = 16
starter = "+++>+++++>[-]<[<+>>+<-]>[<+>-]"
answer = "+++>+++++>[-]<[<+>>+<-]>[<+>-]"
shows_ending = "finished"
shows_cells = [[0, 8], [1, 5]]
hints = ["There is nothing to get right here. ctrl-n moves on."]
task = '''
Nothing to solve. Step through it and watch cell 1 empty and then refill.'''
body = '''
Lesson 3 moved a number with [>+<-], and moving is not adding: what you moved is gone. Real addition has to leave the other number where it found it.

Here is the usual answer, written the way BrainFuck algorithms are usually written down — with names where the moves would be:

  temp[-]
  y[x+temp+y-]
  temp[y+temp-]

The middle line is the one to read: while y is not zero, add one to x, add one to temp, take one from y. It empties y into two places at once. The last line pours temp back, and y is where it started.

That is the shape of nearly every BrainFuck algorithm there is. There are no registers, so the only way to read a value is to destroy it, and the only way to keep it is to destroy it into two places and build it back.

Subtraction is the same algorithm with one character changed:

  y[x-temp+y-]

Below, x is cell 0, y is cell 1, and temp is cell 2, so the names have become moves. Run it and step through.'''

[[lesson]]
title = "Multiplying two numbers"
cells = 16
starter = "++++++>+++++++>[-]>[-]<<<[>>>+<<<-]>>>[<<[<+>>+<-]>[<+>-]>-]"
answer = "++++++>+++++++>[-]>[-]<<<[>>>+<<<-]>>>[<<[<+>>+<-]>[<+>-]>-]"
shows_ending = "finished"
shows_cells = [[0, 42], [1, 7]]
hints = ["There is nothing to get right here. ctrl-n moves on."]
task = '''
Nothing to solve. Notice that neither number is written in the program.'''
body = '''
Lesson 5 multiplied by writing the multiplier into the program: ++++++[>+++++++<-] has the seven spelled out in pluses. That is fine when you know the number while you are typing. It is no use at all when both numbers are on the tape and you know neither.

Multiplication is repeated addition, so the answer is the addition you just read, run x times:

  temp0[-] temp1[-]
  x[temp1+x-]
  temp1[
    y[x+temp0+y-]
    temp0[y+temp0-]
  temp1-]

x is emptied into temp1 first, because the loop that counts x down is also the loop that has to survive x being overwritten with the answer. Then each turn adds y to x and puts y back.

Below, x is cell 0 and y is cell 1, holding 6 and 7. Neither number appears in the program — change the pluses and the same code multiplies whatever you leave there.'''

[[lesson]]
title = "Division, and the remainder with it"
cells = 16
starter = "+++++++++++++++++>>+++++<<[->+>-[>+>>]>[+[-<+>]>+>>]<<<<<<]"
answer = "+++++++++++++++++>>+++++<<[->+>-[>+>>]>[+[-<+>]>+>>]<<<<<<]"
shows_ending = "finished"
shows_cells = [[1, 17], [2, 3], [3, 2], [4, 3]]
hints = ["There is nothing to get right here. ctrl-n moves on."]
task = '''
Nothing to solve. Then change the five to a one and run it again.'''
body = '''
Division is where the trick runs out. There is no repeated-subtraction loop that stops in the right place without also telling you how far it got, so the good algorithms compute the quotient and the remainder together and let you keep whichever you wanted:

  n 0 d
  [->+>-[>+>>]>[+[-<+>]>+>>]<<<<<<]
  0 n d-n%d n%d n/d

Below, n is 17 in cell 0 and d is 5 in cell 2. When it stops, cell 3 holds the remainder 2 and cell 4 holds the quotient 3 — and cell 1 holds 17 again, because this version puts n back.

Do not try to read this one the way you read the last two. Nobody derives it at the keyboard; it is a known result, and knowing where to look it up is the actual skill. What is worth seeing is that it fits on one line.

It has a hole: it does not work when d is 0 or 1. Cut the five pluses after the two > moves down to one, so d is 1, and run it. You do not get a wrong answer — you get an error, because a cell that should have stopped the walk is not zero and the pointer leaves the tape. gyrus checks every access against the end of the tape, which is why this is a message rather than a silently wrong number somewhere else in memory.'''

[[lesson]]
title = "Printing a number"
cells = 16
starter = "++++++++++++++++++++++++++++++++++++++++++>>++++++++++<<[->+>-[>+>>]>[+[-<+>]>+>>]<<<<<<]>>[-]>>>++++++++++<[->-[>+>>]>[+[-<+>]>+>>]<<<<<]>[-]>>[>++++++[-<++++++++>]<.<<+>+>[-]]<[<[->-<]++++++[->++++++++<]>.[-]]<<++++++[-<++++++++>]<.[-]<<[-<+>]<"
answer = "++++++++++++++++++++++++++++++++++++++++++>>++++++++++<<[->+>-[>+>>]>[+[-<+>]>+>>]<<<<<<]>>[-]>>>++++++++++<[->-[>+>>]>[+[-<+>]>+>>]<<<<<]>[-]>>[>++++++[-<++++++++>]<.<<+>+>[-]]<[<[->-<]++++++[->++++++++<]>.[-]]<<++++++[-<++++++++>]<.[-]<<[-<+>]<"
shows_ending = "finished"
shows_cells = [[0, 42]]
shows_output = "42"
hints = ["There is nothing to get right here. ctrl-n moves on."]
task = '''
Nothing to solve. Change the count of pluses at the front and run it again.'''
body = '''
. prints a byte, not a number. Cell 0 holding 42 prints * — the character whose code is 42 — and there is no instruction that prints "42".

Printing a number means finding its digits, and finding a digit means dividing by ten. So this is the previous lesson, twice: once to split off the hundreds, once to split what is left into tens and units, and 48 added to each digit to turn it into the character for it.

The program below is 42 pluses and then that. It prints 42.

This is the longest thing in the course and it is worth sitting with, because it is the moment the ceiling stops being theoretical. A language with eight instructions and no numbers printed a number. Everything a computer does that looks like more than this is the same trick at a scale nobody would type by hand.

Attribution matters here: this one is itchyny's, from Stack Overflow, by way of the esolangs wiki. Nobody writes it from scratch either.'''

[[lesson]]
title = "Placing the cells yourself"
cells = 16
starter = "+++++++++>++++"
answer = "+++++++++>++++>[-]<[<->>+<-]>[<+>-]"
solved_cells = [[0, 5], [1, 4]]
shows_ending = "finished"
shows_cells = [[0, 9], [1, 4]]
hints = [
  "The subtraction is the addition with x+ changed to x-.",
  "temp is cell 2. From cell 1, x is one to the left and temp is one to the right.",
  "Start by moving to cell 2 and clearing it: >[-]. Then come back to y.",
]
task = '''
Cells 0 and 1 hold 9 and 4. Append the subtraction so cell 0 holds 5 and cell 1 still holds 4.'''
body = '''
Every algorithm in the last four lessons was written with names, and every one of them had to have the names replaced with moves before it could run. That replacing is the whole job, and it is the part that goes wrong.

Here is the subtraction again:

  temp[-]
  y[x-temp+y-]
  temp[y+temp-]

The cells are yours to place: x is cell 0, y is cell 1, temp is cell 2. The starter puts 9 and 4 where they belong and leaves the pointer on cell 0. Write the rest.

Two things to keep straight. The pointer is wherever the last instruction left it, not wherever the algorithm's next line begins — every name costs however many moves it takes from *here*. And a loop must leave the pointer where it entered, or the second time round it is somewhere else.'''

[[lesson]]
title = "Names for the cells"
cells = 16
starter = ">+++[>>>+<<<-]"
answer = ">+++[>>>+<<<-]"
shows_ending = "finished"
shows_cells = [[4, 3]]
hints = ["There is nothing to get right here. ctrl-n moves on."]
task = '''
Nothing to solve. This is the last thing worth knowing about the language.'''
body = '''
The algorithms in these lessons are written with names because they are unreadable without them. But the names are not part of BrainFuck. They are a convention people invented so the algorithms could be written down at all, and every time you use one you do the substitution by hand — as you just did.

The example everyone starts with is:

  a[b+a-]

which, if a is cell 1 and b is cell 4, is the program below.

There is no reason that substitution has to be done by a person. gyrus ships a language where the names are real, and expanding them is the machine's job:

  @var a at 1
  @var b at 4
  @to a
  +++
  [
  @to b
  +
  @to a
  -
  ]

That is `.bfm`, and `gyrus prog.bfm` runs it. It expands to exactly the program below — the same eight instructions, the same tape, no new power at all. What it buys is that an error names the line you wrote instead of a column of an expansion nobody wrote.

Each directive is on a line of its own because it has to be: a `@to` sharing a line with anything else is not a directive at all. Everything that is not an instruction is a comment in this language, and that rule does not stop applying just because the text begins with an `@`.

That is the whole arc of this course. Lesson 6 said everything after it was ergonomics; this is what ergonomics looks like. See `docs/macro-language.md`, and `programs/macros/` for programs written in it — one of them prints the lyrics to 99 Bottles, and one factors a number too large to fit in a cell.'''

[[lesson]]
title = "The halting problem"
cells = 16
starter = "+[]"
answer = "+[]"
shows_ending = "capped"
shows_cells = [[0, 1]]
hints = ["Nothing to solve. ctrl-r runs it; the cap does the rest."]
task = '''
Run it, watch the step cap stop it, and you are done.'''
body = '''
In lesson 9 you wrote a program that did not stop, and the tutorial cut it off after a fixed number of steps and said so.

That cap is not laziness. No program can read an arbitrary BrainFuck program and decide whether it halts. Turing proved it in 1936, and the proof does not care which language is being asked about — only that the language can express a program that reads another program's verdict and does the opposite.

BrainFuck can express that. It is the same property that made it Turing complete in lesson 6. The power and the undecidability are one fact seen from two sides: you cannot have a language that can compute anything and also always answer questions about what it will do.

So every tool here has a cutoff where you might have wanted an answer:

  gyrus --max-steps N     stop after N instructions
  gyrus --timeout MS      stop after a wall-clock deadline
  gyrus-tool validate     warns about loops it can prove never end,
                          and says nothing about the rest

That last one is the honest shape of every such tool. It catches the cases it can see and makes no claim about the others, which is not a limitation anyone is going to fix.

Below is a cell set to one and a loop with an empty body that can never change it. Run it.'''


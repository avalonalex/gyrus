[package]
name = "ferrous-cortex-tool"
version = "0.3.0"
edition = "2024"
authors = ["FerrousCortex Contributors"]
description = "Development and analysis tools for BrainFuck programs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/ferrous-cortex"

[[bin]]
name = "ferrous-cortex-tool"
path = "src/main.rs"

[dependencies]
ferrous-cortex = { path = "../ferrous-cortex" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
rand = "0.9.2"

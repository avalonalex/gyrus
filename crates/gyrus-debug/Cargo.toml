[package]
name = "gyrus-debug"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Terminal debugger for BrainFuck programs"

[[bin]]
name = "gyrus-debug"
path = "src/main.rs"

[dependencies]
gyrus.workspace = true
# Only to refuse macro source: the debugger steps through BrainFuck, and a
# `.bfm` read as BrainFuck is a different program that would step confidently.
gyrus-macro.workspace = true
gyrus-tui.workspace = true
clap.workspace = true

[package]
name = "gyrus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A BrainFuck interpreter, optimizer, and debugger with source-located errors, syntax highlighting, and configurable memory and cell models"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["brainfuck", "interpreter", "debugger", "esoteric"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
thiserror.workspace = true
termcolor.workspace = true

# Only needed by the `random` module. Optional so that consumers who just want
# to parse and run BrainFuck do not link a random number generator.
rand = { workspace = true, optional = true }

[features]
default = []
# Random program generation (`gyrus::random`), used by `gyrus-tool generate`
# and for fuzzing the parser and optimizer.
random = ["dep:rand"]

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
# The `random` module's own unit tests need it enabled when testing this crate
# on its own (`cargo test -p gyrus`), not only via gyrus-tool's feature union.
gyrus = { path = ".", features = ["random"] }
# A seedable RNG for the generated differential, and the corpus manifest that
# drives the program tests -- the same one gyrus-jit's corpus test reads.
rand.workspace = true
gyrus-corpus.workspace = true

[[bench]]
name = "interpreter"
harness = false

[[bench]]
name = "parser"
harness = false

[package]
name = "gyrus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A BrainFuck interpreter, optimizer, and debugger with source-located errors, syntax highlighting, and configurable memory and cell models"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/gyrus"
readme = "../../README.md"
keywords = ["brainfuck", "interpreter", "debugger", "esoteric"]
categories = ["development-tools", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror.workspace = true
termcolor.workspace = true
rand.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "interpreter"
harness = false

[[bench]]
name = "parser"
harness = false

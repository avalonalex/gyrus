[workspace]
members = [
    "crates/gyrus",
    "crates/gyrus-cli",
    "crates/gyrus-tool",
    "crates/gyrus-jit",
    "crates/gyrus-corpus",
    "crates/gyrus-tui",
    "crates/gyrus-debug",
    "crates/gyrus-tutorial",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/avalonalex/gyrus"

# Not published to crates.io. This is a learning project, not a dependency
# anyone should take on, and a name on the registry is a commitment to keep.
# `publish = false` makes `cargo publish` fail rather than relying on nobody
# running it.
publish = false

# Minimum supported Rust version: Cranelift's, which is "stable minus two"
# and moves about every six weeks. The library alone needs only 1.88 (it uses
# let-chains, stabilized there; 1.85, the edition-2024 floor, does not build
# it), but one MSRV for the workspace beats two, and the pinned toolchain in
# rust-toolchain.toml is what anyone here actually compiles with. Bumping
# Cranelift may mean bumping this; `scripts/check-msrv.sh` is the check.
rust-version = "1.95"

# Shared dependencies across the workspace
#
# Versions are stated at the granularity of a *breaking* change, and nothing
# finer. Cargo requirements are already caret ranges — "2" and "2.0.17" have
# the identical upper bound of <3.0.0, and the extra digits only assert a
# minimum nobody here depends on — so spelling out patch levels does not
# constrain anything; it just invites pointless edits. For 0.x crates the
# minor field is the breaking unit, so "0.9" means <0.10.0.
#
# The effect: `cargo update` handles every compatible upgrade on its own and
# records it in Cargo.lock, and a manifest edit is required exactly when a
# dependency makes a breaking release. Cargo.lock is committed, so the exact
# versions in use are always pinned regardless of how loose these ranges are.
[workspace.dependencies]
# Internal
gyrus = { path = "crates/gyrus" }
gyrus-jit = { path = "crates/gyrus-jit" }
gyrus-corpus = { path = "crates/gyrus-corpus" }
gyrus-tui = { path = "crates/gyrus-tui" }

# Error handling
thiserror = "2"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Cross-platform terminal colors
termcolor = "1"

# Random program generation for fuzzing and testing
rand = "0.9"

# JSON output for `gyrus-tool debug-info`
serde_json = "1"

# Cranelift, for the JIT (`crates/gyrus-jit` only). Its MSRV is the
# workspace's; see `rust-version` above.
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-module = "0.135"
cranelift-jit = "0.135"
cranelift-native = "0.135"

# Terminal UI, for the debugger and tutorial (`gyrus-tui` and its two binaries).
# Default features are the crossterm backend and the widget set; the other
# backends stay off.
ratatui = "0.30"

# Property-based testing
proptest = "1"

# Benchmarking
criterion = { version = "0.7", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1

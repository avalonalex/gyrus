[workspace]
members = [
    "crates/gyrus",
    "crates/gyrus-cli",
    "crates/gyrus-tool",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/avalonalex/gyrus"

[workspace.dependencies]
# Shared dependencies
thiserror = "2.0.17"
clap = { version = "4.5.51", features = ["derive"] }

# Internal dependencies
gyrus = { path = "crates/gyrus" }

[profile.release]
lto = true
codegen-units = 1
